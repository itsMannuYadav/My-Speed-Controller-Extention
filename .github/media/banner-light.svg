<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="My Speed Up — control playback, your way">
  <title>My Speed Up</title>
  <defs>
    <linearGradient id="shimmer-light" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#4338ca" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#6d28d9" stop-opacity="1"/>
      <stop offset="1" stop-color="#4338ca" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-40 0" to="1250 0" dur="3.2s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="frame-light">
      <rect width="1200" height="260" rx="28"/>
    </clipPath>
    <style>
      .sp-bg { fill: #ffffff; }
      .sp-word { font: 800 60px "Segoe UI", ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #14141a; letter-spacing: -1px; }
      .sp-word-shine { font: 800 60px "Segoe UI", ui-sans-serif, system-ui, -apple-system, sans-serif; fill: url(#shimmer-light); letter-spacing: -1px; }
      .sp-tag { font: 500 21px "Segoe UI", ui-sans-serif, system-ui, sans-serif; fill: #5c5c6e; }
      .sp-pill-text { font: 700 13px ui-monospace, "Segoe UI Mono", monospace; fill: #4338ca; }
      .sp-tick { font: 700 30px ui-monospace, "Segoe UI Mono", monospace; fill: #4338ca; }
      .sp-dial-label { font: 600 12px ui-sans-serif, system-ui, sans-serif; fill: #5c5c6e; letter-spacing: 2px; text-transform: uppercase; }

      .sp-icon { transform-box: fill-box; transform-origin: center; animation: sp-pulse 3.4s ease-in-out infinite; }
      @keyframes sp-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.045); } }

      .sp-swoosh-glow { stroke-dasharray: 18 82; animation: sp-flow 2.2s linear infinite; }
      @keyframes sp-flow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -100; } }

      .sp-streak { animation: sp-slide linear infinite; }
      @keyframes sp-slide { from { transform: translateX(-140px); } to { transform: translateX(1200px); } }

      .sp-tick-a, .sp-tick-b, .sp-tick-c, .sp-tick-d { animation: sp-cross 4.8s ease-in-out infinite; opacity: 0; }
      .sp-tick-a { animation-delay: 0s; }
      .sp-tick-b { animation-delay: 1.2s; }
      .sp-tick-c { animation-delay: 2.4s; }
      .sp-tick-d { animation-delay: 3.6s; }
      @keyframes sp-cross { 0% { opacity: 0; } 6% { opacity: 1; } 22% { opacity: 1; } 28% { opacity: 0; } 100% { opacity: 0; } }

      @media (prefers-reduced-motion: reduce) {
        .sp-icon, .sp-swoosh-glow, .sp-streak, .sp-tick-a, .sp-tick-b, .sp-tick-c, .sp-tick-d, .sp-needle { animation: none !important; }
        .sp-tick-a { opacity: 1 !important; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame-light)">
    <rect width="1200" height="260" class="sp-bg"/>

    <!-- ambient speed streaks -->
    <g opacity="0.5">
      <rect class="sp-streak" x="0" y="46" width="90" height="4" rx="2" fill="#eeedfd" style="animation-duration:2.6s"/>
      <rect class="sp-streak" x="0" y="70" width="130" height="3" rx="1.5" fill="#eeedfd" style="animation-duration:3.4s; animation-delay:-1.1s"/>
      <rect class="sp-streak" x="0" y="204" width="110" height="3" rx="1.5" fill="#eeedfd" style="animation-duration:3s; animation-delay:-0.6s"/>
      <rect class="sp-streak" x="0" y="226" width="70" height="4" rx="2" fill="#eeedfd" style="animation-duration:2.2s; animation-delay:-1.6s"/>
    </g>

    <!-- mark -->
    <g class="sp-icon" transform="translate(46,62)">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#6366F1"/>
          <stop offset="0.55" stop-color="#4F46E5"/>
          <stop offset="1" stop-color="#7C3AED"/>
        </linearGradient>
        <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
          <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="play" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFFFFF"/>
          <stop offset="1" stop-color="#E0E7FF"/>
        </linearGradient>
      </defs>
      <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
      <path d="M4 32 a28 28 0 0 1 28 -28 h64 a28 28 0 0 1 28 28 v22 c-30 14 -90 14 -120 0 z" fill="url(#gloss)"/>
      <g fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 44 L33 64 L17 84" opacity="0.32"/>
        <path d="M38 44 L54 64 L38 84" opacity="0.62"/>
      </g>
      <path d="M68 36 L106 64 L68 92 Z" fill="url(#play)" stroke="url(#play)" stroke-width="9" stroke-linejoin="round"/>
    
    </g>

    <!-- wordmark -->
    <g transform="translate(200,0)">
      <text x="0" y="118" class="sp-word">My Speed Up</text>
      <text x="0" y="118" class="sp-word-shine">My Speed Up</text>
      <text x="4" y="152" class="sp-tag">Control playback. Your way.</text>
      <rect x="2" y="172" width="238" height="26" rx="13" fill="#eeedfd"/>
      <text x="16" y="189" class="sp-pill-text">FREE · NO TRACKING · LOCAL-ONLY</text>
    </g>

    <!-- speed dial -->
    <g transform="translate(1010,132)">
      <path d="M -78 39 A 84 84 0 1 1 78 39" fill="none" stroke="#eeedfd" stroke-width="10" stroke-linecap="round"/>
      <path d="M -78 39 A 84 84 0 0 1 12 -82" fill="none" stroke="#4338ca" stroke-width="10" stroke-linecap="round"/>
      <g class="sp-needle">
        <line x1="0" y1="0" x2="0" y2="-60" stroke="#14141a" stroke-width="5" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="rotate" values="-114;114;-114" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="4.8s" repeatCount="indefinite"/>
      </g>
      <circle r="7" fill="#14141a"/>
      <g text-anchor="middle">
        <text class="sp-tick sp-tick-a" x="0" y="64">0.25×</text>
        <text class="sp-tick sp-tick-b" x="0" y="64">1×</text>
        <text class="sp-tick sp-tick-c" x="0" y="64">2.5×</text>
        <text class="sp-tick sp-tick-d" x="0" y="64">4.5×</text>
      </g>
      <text class="sp-dial-label" x="0" y="94" text-anchor="middle">Your speed</text>
    </g>
  </g>
</svg>
