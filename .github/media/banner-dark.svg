<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="SpeedPilot — control playback, your way">
  <title>SpeedPilot</title>
  <defs>
    <linearGradient id="shimmer-dark" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#8583f5" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c4c2ff" stop-opacity="1"/>
      <stop offset="1" stop-color="#8583f5" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-40 0" to="1250 0" dur="3.2s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="frame-dark">
      <rect width="1200" height="260" rx="28"/>
    </clipPath>
    <style>
      .sp-bg { fill: #101014; }
      .sp-word { font: 800 60px "Segoe UI", ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #f2f2f6; letter-spacing: -1px; }
      .sp-word-shine { font: 800 60px "Segoe UI", ui-sans-serif, system-ui, -apple-system, sans-serif; fill: url(#shimmer-dark); letter-spacing: -1px; }
      .sp-tag { font: 500 21px "Segoe UI", ui-sans-serif, system-ui, sans-serif; fill: #9797a8; }
      .sp-pill-text { font: 700 13px ui-monospace, "Segoe UI Mono", monospace; fill: #8583f5; }
      .sp-tick { font: 700 30px ui-monospace, "Segoe UI Mono", monospace; fill: #8583f5; }
      .sp-dial-label { font: 600 12px ui-sans-serif, system-ui, sans-serif; fill: #9797a8; letter-spacing: 2px; text-transform: uppercase; }

      .sp-icon { transform-box: fill-box; transform-origin: center; animation: sp-pulse 3.4s ease-in-out infinite; }
      @keyframes sp-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.045); } }

      .sp-swoosh-glow { stroke-dasharray: 18 82; animation: sp-flow 2.2s linear infinite; }
      @keyframes sp-flow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -100; } }

      .sp-streak { animation: sp-slide linear infinite; }
      @keyframes sp-slide { from { transform: translateX(-140px); } to { transform: translateX(1200px); } }

      .sp-tick-a, .sp-tick-b, .sp-tick-c, .sp-tick-d { animation: sp-cross 4.8s ease-in-out infinite; opacity: 0; }
      .sp-tick-a { animation-delay: 0s; }
      .sp-tick-b { animation-delay: 1.2s; }
      .sp-tick-c { animation-delay: 2.4s; }
      .sp-tick-d { animation-delay: 3.6s; }
      @keyframes sp-cross { 0% { opacity: 0; } 6% { opacity: 1; } 22% { opacity: 1; } 28% { opacity: 0; } 100% { opacity: 0; } }

      @media (prefers-reduced-motion: reduce) {
        .sp-icon, .sp-swoosh-glow, .sp-streak, .sp-tick-a, .sp-tick-b, .sp-tick-c, .sp-tick-d, .sp-needle { animation: none !important; }
        .sp-tick-a { opacity: 1 !important; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame-dark)">
    <rect width="1200" height="260" class="sp-bg"/>

    <!-- ambient speed streaks -->
    <g opacity="0.5">
      <rect class="sp-streak" x="0" y="46" width="90" height="4" rx="2" fill="#201f34" style="animation-duration:2.6s"/>
      <rect class="sp-streak" x="0" y="70" width="130" height="3" rx="1.5" fill="#201f34" style="animation-duration:3.4s; animation-delay:-1.1s"/>
      <rect class="sp-streak" x="0" y="204" width="110" height="3" rx="1.5" fill="#201f34" style="animation-duration:3s; animation-delay:-0.6s"/>
      <rect class="sp-streak" x="0" y="226" width="70" height="4" rx="2" fill="#201f34" style="animation-duration:2.2s; animation-delay:-1.6s"/>
    </g>

    <!-- mark -->
    <g class="sp-icon" transform="translate(46,62)">
      <rect x="4" y="4" width="120" height="120" rx="28" fill="#8583f5"/>
      <path d="M50 40 L90 64 L50 88 Z" fill="#FFFFFF"/>
      <path d="M24 88 C 34 100, 50 106, 64 106" stroke="#A5B4FC" stroke-width="8" stroke-linecap="round" fill="none"/>
      <path d="M18 72 C 30 88, 48 96, 64 96" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.9"/>
      <path class="sp-swoosh-glow" pathLength="100" d="M24 88 C 34 100, 50 106, 64 106" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path class="sp-swoosh-glow" pathLength="100" d="M18 72 C 30 88, 48 96, 64 96" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" style="animation-delay:-0.7s"/>
    </g>

    <!-- wordmark -->
    <g transform="translate(200,0)">
      <text x="0" y="118" class="sp-word">SpeedPilot</text>
      <text x="0" y="118" class="sp-word-shine">SpeedPilot</text>
      <text x="4" y="152" class="sp-tag">Control playback. Your way.</text>
      <rect x="2" y="172" width="238" height="26" rx="13" fill="#201f34"/>
      <text x="16" y="189" class="sp-pill-text">FREE · NO TRACKING · LOCAL-ONLY</text>
    </g>

    <!-- speed dial -->
    <g transform="translate(1010,132)">
      <path d="M -78 39 A 84 84 0 1 1 78 39" fill="none" stroke="#201f34" stroke-width="10" stroke-linecap="round"/>
      <path d="M -78 39 A 84 84 0 0 1 12 -82" fill="none" stroke="#8583f5" stroke-width="10" stroke-linecap="round"/>
      <g class="sp-needle">
        <line x1="0" y1="0" x2="0" y2="-60" stroke="#f2f2f6" stroke-width="5" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="rotate" values="-114;114;-114" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="4.8s" repeatCount="indefinite"/>
      </g>
      <circle r="7" fill="#f2f2f6"/>
      <g text-anchor="middle">
        <text class="sp-tick sp-tick-a" x="0" y="64">0.25×</text>
        <text class="sp-tick sp-tick-b" x="0" y="64">1×</text>
        <text class="sp-tick sp-tick-c" x="0" y="64">2.5×</text>
        <text class="sp-tick sp-tick-d" x="0" y="64">4.5×</text>
      </g>
      <text class="sp-dial-label" x="0" y="94" text-anchor="middle">Your speed</text>
    </g>
  </g>
</svg>
