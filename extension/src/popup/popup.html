<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Speed Up</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup" id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 128 128" width="100%" height="100%"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366F1"/><stop offset="0.55" stop-color="#4F46E5"/><stop offset="1" stop-color="#7C3AED"/></linearGradient><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient><linearGradient id="play" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E0E7FF"/></linearGradient></defs><rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/><path d="M4 32 a28 28 0 0 1 28 -28 h64 a28 28 0 0 1 28 28 v22 c-30 14 -90 14 -120 0 z" fill="url(#gloss)"/><g fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"><path d="M17 44 L33 64 L17 84" opacity="0.32"/><path d="M38 44 L54 64 L38 84" opacity="0.62"/></g><path d="M68 36 L106 64 L68 92 Z" fill="url(#play)" stroke="url(#play)" stroke-width="9" stroke-linejoin="round"/></svg></span>
          <span class="brand-name">My Speed Up</span>
        </div>
        <div class="topbar-actions">
          <button id="open-options" class="icon-btn" type="button" aria-label="Open settings" title="Settings">⚙</button>
          <button id="open-sidepanel" class="icon-btn" type="button" aria-label="Open side panel" title="Side panel">⋮</button>
        </div>
      </header>

      <div id="content" aria-live="polite">
        <!-- populated by popup.ts depending on state: loading / empty / single / multiple / error -->
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
